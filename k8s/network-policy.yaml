
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flask-network-policy
spec:
  podSelector:
    matchLabels:
      app: flask-app

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: flask-client
      ports:
        - protocol: TCP
          port: 5000
