name: Deploy to Azure via OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for requesting the JWT from GitHub's OIDC provider
  contents: read  # Required for actions/checkout

jobs:
  azure-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Scan de Sécurité avec Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          soft_fail: false # 'false' pour bloquer le pipeline si une faille est trouvée
      
      - name: Authenticate via Azure Entra ID OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure CLI commands safely
        run: |
          az account show
          az group list --output table
  deploy-to-production:
    runs-on: ubuntu-latest
    needs: azure-login # Attend que le build réussisse
    
    # C'est cette ligne qui déclenche le blocage et l'approbation manuelle
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      - name: Deploying to Production Server
        run: echo "Deploying code live!"
