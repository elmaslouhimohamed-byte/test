
name: DevSecOps - Build and Deploy to AKS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: acrdevsecops2026
  ACR_LOGIN_SERVER: acrdevsecops2026.azurecr.io
  IMAGE_NAME: flask-app
  AKS_RESOURCE_GROUP: rg_days
  AKS_CLUSTER_NAME: aks-devsecops

jobs:

  # ==========================================
  # JOB 1: TESTS AND SECURITY VALIDATION
  # ==========================================
  validate:
    name: Tests and Security Scans
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v tests/

      - name: Checkov - Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false

      # Enable when ready:
      # - name: Checkov - Dockerfile
      #   uses: bridgecrewio/checkov-action@v12
      #   with:
      #     file: ./Dockerfile
      #     framework: dockerfile
      #     soft_fail: false


  # ==========================================
  # JOB 2: BUILD + SCAN + EXPORT IMAGE
  # ==========================================
  build-and-scan:
    name: Build and Scan Docker Image
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Build Docker image ONCE
      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA .

      # Scan the exact local image
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: acrdevsecops2026.azurecr.io/flask-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Export the scanned image
      - name: Export Docker image
        run: |
          docker save \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA \
            -o flask-image.tar

      # Temporarily transfer image to the next job
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-image-${{ github.sha }}
          path: flask-image.tar
          retention-days: 1
          if-no-files-found: error


  # ==========================================
  # JOB 3: APPROVAL + PUSH + DEPLOY
  # ==========================================
  publish-and-deploy:
    name: Approve, Push and Deploy Production

    needs: build-and-scan

    runs-on: ubuntu-latest

    # Approval happens BEFORE this job starts
    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Retrieve the exact image scanned in Job 2
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-image-${{ github.sha }}

      # Load image into the new runner
      - name: Load Docker image
        run: |
          docker load -i flask-image.tar

      # Azure authentication using OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      # Push the SAME image that passed Trivy
      - name: Push Docker image to ACR
        run: |
          docker push \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA

      # Retrieve immutable image digest
      - name: Get image digest
        id: get-digest
        run: |
          DIGEST=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:$GITHUB_SHA" \
            --query digest \
            --output tsv)

          if [ -z "$DIGEST" ]; then
            echo "ERROR: Image digest not found"
            exit 1
          fi

          IMAGE_REF="$ACR_LOGIN_SERVER/$IMAGE_NAME@$DIGEST"

          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

          echo "Image to deploy: $IMAGE_REF"

      # Install kubelogin
      - name: Install kubelogin
        uses: Azure/use-kubelogin@v1
        with:
          kubelogin-version: 'latest'

      # Connect to AKS
      - name: Connect to AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      # Deploy exact image digest
      - name: Deploy to production
        run: |
          kubectl apply -f k8s/namespace.yaml

          sed "s|REPLACE_IMAGE|$IMAGE_REF|g" \
            k8s/deployment.yaml > /tmp/deployment.yaml

          kubectl apply -f /tmp/deployment.yaml

          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/network-policy.yaml

      # Verify deployment
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/flask-app \
            -n production --timeout=180s

          kubectl get pods -n production
          kubectl get services -n production
