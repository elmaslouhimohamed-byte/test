
name: DevSecOps - Build and Deploy to AKS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: acrdevsecops2026
  ACR_LOGIN_SERVER: acrdevsecops2026.azurecr.io
  IMAGE_NAME: flask-app
  AKS_RESOURCE_GROUP: rg-terraform-infrastructure
  AKS_CLUSTER_NAME: aks-devsecops

jobs:
  validate:
    name: Tests and Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v tests/

      - name: Checkov - Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false

      - name: Checkov - Kubernetes
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./k8s
          framework: kubernetes
          soft_fail: false

      - name: Checkov - Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          file: ./Dockerfile
          framework: dockerfile
          soft_fail: false

  build:
    name: Build and Scan Docker Image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: acrdevsecops2026.azurecr.io/flask-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish-and-deploy:
    name: Approve, Push and Deploy Production
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Push Docker image to ACR
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA .
          docker push \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA

      - name: Connect to AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Deploy to production
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"

          kubectl apply -f k8s/namespace.yaml

          sed "s|REPLACE_IMAGE|$IMAGE|g" \
            k8s/deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/network-policy.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/flask-app \
            -n production --timeout=180s

          kubectl get pods -n production
          kubectl get services -n production
